function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {

  do {
    slots = shuffle(positions).slice(0, picks.length);
    keyword = slots.map(slot => code[slot]).join('');
  } while (keyword === previous.keyword);
  previous = {questions: questionIds, keyword};
  try { localStorage.setItem('phieu2-luot-choi', JSON.stringify(previous)); } catch {}
  deck = picks.map(([prompt, options, answer, note], i) => [prompt, options, answer, slots[i], note]);
  index = 0;
  earned = new Set();
  responses = [];
  get('login').hidden = true;
  get('board').hidden = false;
  get('restart').hidden = false;
  get('review').hidden = true;
  get('quiz').hidden = false;
  showQuestion();
  deadline = Date.now() + timeLimit;
  updateTimer();
  timerInterval = setInterval(updateTimer, 250);
}
get('join').onsubmit = event => {
  event.preventDefault();
  if (!get('player').value.trim()) return;
  start();
  get('choices').firstElementChild.focus();
};
get('restart').onclick = () => {
  stopTimer();
  for (const id of ['board', 'quiz', 'review', 'restart']) get(id).hidden = true;
  get('login').hidden = false;
  get('join').reset();
  get('player').focus();
};
get('next').onclick = () => {
  if (!deadline || Date.now() >= deadline) { finish(true); return; }
  if (++index < deck.length) {
    showQuestion();
    get('choices').firstElementChild.focus();
  } else {
    finish(false);
  }
};
function finish(timedOut) {
  if (!deadline) return;
  const elapsedSeconds = Math.min(timeLimit / 1000,
    Math.max(0, Math.ceil((Date.now() - deadline + timeLimit) / 1000)));
  stopTimer();
  for (const [, , , slot] of deck.filter((question, i) => responses[i]?.answer === question[2])) {
    earned.add(slot);
  }
  const result = {
    group: get('player').value.trim(),
    correct: earned.size,
    total: deck.length,
    submittedAt: new Date().toISOString()
  };
  let status = 'Điểm đã được ghi trên thiết bị này.';
  try {
    const key = 'phieu2-ket-qua';
    const results = JSON.parse(localStorage.getItem(key) || '[]');
    results.push(result);
    localStorage.setItem(key, JSON.stringify(results));
  } catch {
    status = 'Thiết bị không lưu được điểm.';
  }
  get('score').textContent = result.group + ' · ' + (Math.round(100 * result.correct / result.total) / 10).toLocaleString('vi-VN') + '/10 điểm';
  const prefix = timedOut ? 'Đã hết 8 phút. ' : '';
  get('save-status').textContent = prefix + 'Đang gửi điểm lên Google Sheets…';
  const payload = {
    hoTen: result.group,
    tongSoCau: deck.length,
    thoiGianGiay: elapsedSeconds,
    soCauDung: result.correct,
    cauSai: deck.flatMap((question, i) => {
      const [ , answers, correct] = question;
      const response = responses[i];
      return response && response.answer !== correct
        ? [{cauGoc: bank.findIndex(item => item[0] === question[0]) + 1, daChon: answers[response.answer]}]
        : [];
    })
  };
  sendResults(payload, prefix, status, deck);
  get('review').hidden = false;
  get('quiz').hidden = true;
  get('score').focus();
  drawTiles();
}

async function sendResults(payload, prefix, localStatus, submittedDeck) {
  let message;
  try {
    const response = await fetch(resultsUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const receipt = await response.json();
    if (!receipt.ok) {
      message = (receipt.message || 'Google Sheets chưa xác nhận kết quả.') + ' ' + localStatus;
    } else {
      message = 'Đã lưu điểm vào Google Sheets.';
      if (receipt.vinhDanhDaCapNhat === false) message += ' Bảng vinh danh chưa cập nhật.';
    }
  } catch {
    message = 'Chưa xác nhận được điểm trên Google Sheets. ' + localStatus;
  }
  if (deck === submittedDeck && !get('review').hidden) {
    get('save-status').textContent = prefix + message;
  }
}
